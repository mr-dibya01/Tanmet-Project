<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic SEO -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tanmet Technologies Pvt Ltd | IT Solutions & Software Development Company India</title>
  <meta name="description" content="Tanmet Technologies is a leading IT solutions and software development company in India specializing in web applications, mobile apps, Oracle applications, cloud solutions, and digital transformation." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://tanmettechnologies.com" />

  <!-- Open Graph (Facebook / LinkedIn / Social Preview) -->
  <meta property="og:title" content="Tanmet Technologies - Innovating Digital Future | IT Solutions India" />
  <meta property="og:description" content="We build scalable and intelligent solutions for businesses worldwide. Web Apps, Mobile Apps, Cloud Solutions & Oracle Applications." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://tanmettechnologies.com" />
  <meta property="og:image" content="https://tanmettechnologies.com/og-image.jpg" />

  <!-- Twitter Card (Social Preview) -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Tanmet Technologies - Innovating Digital Future" />
  <meta name="twitter:description" content="Leading IT solutions company in India. Web Apps, Mobile Apps, Cloud Solutions & Oracle Applications." />
  <meta name="twitter:image" content="https://tanmettechnologies.com/og-image.jpg" />

  <!-- Brand + Mobile Browser UI -->
  <meta name="theme-color" content="#0A1D37" />

  <!-- Fonts Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <!-- Structured Data - Company Info (Clean + Single Schema) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Tanmet Technologies Pvt Ltd",
    "url": "https://tanmettechnologies.com",
    "logo": "https://tanmettechnologies.com/logo.png",
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "customer service",
      "availableLanguage": ["English", "Hindi"]
    },
    "sameAs": [
      "https://twitter.com/TanmetTech",
      "https://linkedin.com/company/tanmet-technologies"
    ]
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
